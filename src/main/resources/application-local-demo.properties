# Entorno de demostración aislado. No conecta con Oracle ni lee el .env.
spring.datasource.url=jdbc:h2:mem:panpuntospremios_local;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
app.database.schema=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:local-demo-schema.sql
spring.sql.init.data-locations=classpath:local-demo-data.sql

# Mailpit local: captura mensajes, no los entrega a destinatarios externos.
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=no-reply@panpuntos.test
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.portal.base-url=http://localhost:3000
server.servlet.session.cookie.secure=false
