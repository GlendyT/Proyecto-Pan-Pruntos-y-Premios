# ============================================================================
# API REST Spring Boot - Pan, Puntos y Premios
# Configuración local y de producción
# ============================================================================

spring.application.name=pan-puntos-premios-api

# Servidor HTTP
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Datasource y HikariCP
# Toma DB_URL, DB_USER, DB_PASSWORD de variables de entorno o archivo .env local
# En caso de ausencia (ej. pruebas sin Oracle local), utiliza H2 en memoria compatible con Oracle
spring.datasource.url=${DB_URL:jdbc:h2:mem:panpuntospremios;MODE=Oracle;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Bounded Pool para proteger cuotas de Oracle Autonomous Database
spring.datasource.hikari.pool-name=PanPuntosHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# Actuator / Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Sesiones HTTP y Cookies
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=PANPUNTOS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Configuración de Enlace de Acceso (Passwordless)
app.portal.base-url=${APP_PORTAL_BASE_URL:http://localhost:3000}
app.auth.token-expiration-minutes=15
app.auth.rate-limit.ip-max-requests=10
app.auth.rate-limit.ip-window-minutes=15

# Configuración de Correo (Gmail o variables de entorno)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
