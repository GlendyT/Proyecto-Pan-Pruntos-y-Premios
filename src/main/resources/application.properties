# ============================================================================
# API REST Spring Boot - Pan, Puntos y Premios
# Configuración local y de producción
# ============================================================================

spring.application.name=pan-puntos-premios-api

# Servidor HTTP
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Datasource y HikariCP
# Toma DB_URL, DB_USER, DB_PASSWORD de variables de entorno o archivo .env local
# En caso de ausencia (ej. pruebas sin Oracle local), utiliza H2 en memoria compatible con Oracle
spring.datasource.url=${DB_URL:jdbc:h2:mem:panpuntospremios;MODE=Oracle;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Bounded Pool para proteger cuotas de Oracle Autonomous Database
spring.datasource.hikari.pool-name=PanPuntosHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# Actuator / Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
