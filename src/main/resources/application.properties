# ============================================================================
# API REST Spring Boot - Pan, Puntos y Premios
# Configuración local y de producción
# ============================================================================

spring.application.name=pan-puntos-premios-api

# Servidor HTTP
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Datasource y HikariCP
# Toma DB_URL, DB_USER, DB_PASSWORD y DB_SCHEMA de variables de entorno o .env.
# Los perfiles de prueba/local-demo configuran H2 de forma aislada.
spring.datasource.url=${DB_URL:jdbc:h2:mem:panpuntospremios;MODE=Oracle;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
app.database.schema=${DB_SCHEMA:}

# Bounded Pool para proteger cuotas de Oracle Autonomous Database
spring.datasource.hikari.pool-name=PanPuntosHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# Actuator / Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Sesiones HTTP y Cookies
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=PANPUNTOS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Configuración de Enlace de Acceso (Passwordless)
app.portal.base-url=${APP_PORTAL_BASE_URL:http://localhost:3000}
app.auth.token-expiration-minutes=15
app.auth.rate-limit.ip-max-requests=10
app.auth.rate-limit.ip-window-minutes=15

# Configuración de Correo. EmailJS se invoca desde el backend cuando EMAIL_PROVIDER=emailjs.
# SMTP permanece disponible cuando EMAIL_PROVIDER=smtp.
app.email.provider=${EMAIL_PROVIDER:smtp}
emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
emailjs.private-key=${EMAILJS_PRIVATE_KEY:}

# Configuración SMTP alternativa (variables de entorno)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
